syntax = "proto3";

import "google/protobuf/empty.proto";

message ApplicationMetadata {
  string name = 1;
  string version = 2;
}

message SetThemeRequest {
  string theme = 1;
}

message SetUnsavedIconStateRequest {
  // True while the user has icon work that has not been saved to disk.
  bool unsaved = 1;
}

message SaveIconRequest {
  // Finished 1024×1024 PNG shown in preview: macOS 15 contour, transparent
  // margins and outer shadow included. Never send the raw model artwork.
  bytes image_data = 1;
}

message SaveIconResponse {
  string saved_path = 1;
  bool canceled = 2;
  // Full path to the saved .icns file when the save succeeded.
  string icns_path = 3;
}

message ShowPathInFinderRequest {
  // Absolute path to a file or folder to reveal in Finder.
  string path = 1;
}

message GenerateIconRequest {
  string prompt = 1;
  string negative_prompt = 2;
  // Original artwork as base64-encoded PNG, no data URL prefix.
  // Refinement uses the raw variant without export mask, margins or shadow.
  // Empty = no reference image.
  string reference_image = 3;
  // Seed for reproducibility. 0 = pick automatically.
  int32 seed = 4;
  string request_id = 5;
}

message CancelGenerationRequest { string request_id = 1; }

message CodexStatus {
  // not_installed, update_required, signed_out, waiting, ready, or error.
  string state = 1;
  string email = 2;
  string error = 3;
}

message SetGenerationConnectionRequest {
  // codex or api (checked before saving), or none to disconnect only MōIcons.
  string connection = 1;
}

message GenerateIconResponse {
  // Full-bleed PNG, JPEG, or WebP artwork as base64, no data URL prefix.
  // The renderer normalizes to PNG, applies export styling, and keeps originals for edits.
  repeated string images = 1;
  string error = 2;
}

message GetOpenAIApiKeyStatusRequest {}

message GetOpenAIApiKeyStatusResponse {
  // True when the OpenAI provider is active (a stored API key is required).
  bool openai_key_required = 1;
  // True when a non-empty OpenAI API key is already stored in preferences.
  bool has_openai_key = 2;
}

message SetOpenAIApiKeyRequest {
  string api_key = 1;
}

message SetOpenAIApiKeyResponse {
  // Empty on success; otherwise a short error message for the user.
  string error = 1;
  GetGenerationSettingsResponse settings = 2;
}

message RemoveApiKeyResponse {
  string error = 1;
}

message GetStoredOpenAIApiKeyRequest {}

message GetStoredOpenAIApiKeyResponse {
  // Value from app preferences; empty if none saved.
  string api_key = 1;
}

message OpenExternalUrlRequest {
  // https URL (or other scheme) to open in the system default handler.
  string url = 1;
}

message ImageModelOption {
  string id = 1;
  string name = 2;
  repeated string qualities = 3;
}

message GetGenerationSettingsRequest {
  bool refresh = 1;
}

message GetGenerationSettingsResponse {
  string provider = 1;
  string model = 2;
  string quality = 3;
  repeated ImageModelOption models = 4;
  string error = 5;
  bool has_api_key = 6;
  bool api_key_required = 7;
  string error_code = 8;
  CodexStatus codex = 9;
  bool ready = 10;
}

message SetGenerationSettingsRequest {
  string provider = 1;
  string model = 2;
  string quality = 3;
}

message SetGenerationSettingsResponse {
  string error = 1;
}

message PickReferenceImageRequest {}

message PickReferenceImageResponse {
  // Base64-encoded image bytes, no data URL prefix. Empty when canceled/failed.
  string image_b64 = 1;
  // MIME type of the selected image, e.g. "image/png".
  string mime = 2;
  // True when the user dismissed the dialog without choosing a file.
  bool canceled = 3;
  // Empty on success; otherwise a short error message for the user.
  string error = 4;
}

service AppService {
  rpc GetApplicationMetadata(google.protobuf.Empty) returns (ApplicationMetadata);
  rpc SetTheme(SetThemeRequest) returns (google.protobuf.Empty);
  rpc SetUnsavedIconState(SetUnsavedIconStateRequest) returns (google.protobuf.Empty);
  rpc SaveIcon(SaveIconRequest) returns (SaveIconResponse);
  rpc ShowPathInFinder(ShowPathInFinderRequest) returns (google.protobuf.Empty);
  rpc GenerateIcon(GenerateIconRequest) returns (GenerateIconResponse);
  rpc CancelGeneration(CancelGenerationRequest) returns (google.protobuf.Empty);
  rpc GetCodexStatus(google.protobuf.Empty) returns (CodexStatus);
  rpc StartCodexLogin(google.protobuf.Empty) returns (CodexStatus);
  rpc CancelCodexLogin(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc SetGenerationConnection(SetGenerationConnectionRequest) returns (GetGenerationSettingsResponse);
  rpc GetGenerationSettings(GetGenerationSettingsRequest) returns (GetGenerationSettingsResponse);
  rpc SetGenerationSettings(SetGenerationSettingsRequest) returns (SetGenerationSettingsResponse);
  rpc GetOpenAIApiKeyStatus(GetOpenAIApiKeyStatusRequest) returns (GetOpenAIApiKeyStatusResponse);
  rpc GetStoredOpenAIApiKey(GetStoredOpenAIApiKeyRequest) returns (GetStoredOpenAIApiKeyResponse);
  rpc SetOpenAIApiKey(SetOpenAIApiKeyRequest) returns (SetOpenAIApiKeyResponse);
  rpc RemoveApiKey(google.protobuf.Empty) returns (RemoveApiKeyResponse);
  rpc OpenExternalUrl(OpenExternalUrlRequest) returns (google.protobuf.Empty);
  rpc PickReferenceImage(PickReferenceImageRequest) returns (PickReferenceImageResponse);
}
